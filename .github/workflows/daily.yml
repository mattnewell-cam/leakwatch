name: Daily leak update

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC every day
  workflow_dispatch:
    inputs:
      resolve:
        description: "Re-check pending claims"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/build_site.py", "leakwatch/scoring.py", "leakwatch/resolve.py", "tests/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: leakwatch-daily
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scoring regression tests
        run: python -m tests.test_scoring
      - name: Pull new posts, extract and score claims, re-check pending
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.resolve }}" = "false" ]; then
            python -m leakwatch.daily --no-resolve
          else
            python -m leakwatch.daily
          fi
      - run: python -m scripts.build_site
      - name: Weekly refresh of leaker verdict blurbs (Mondays)
        if: github.event_name == 'schedule'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python -m scripts.refresh_summaries --apply && python -m scripts.build_site
          fi
      - name: Commit data
        run: |
          git config user.name "leakwatch-bot"
          git config user.email "leakwatch-bot@users.noreply.github.com"
          git add data
          git commit -m "Daily update $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git pull --rebase origin main
          git push

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m tests.test_scoring
      - run: python -m scripts.build_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
